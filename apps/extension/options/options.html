<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusGuard Extension — Local Policy Inspector</title>
  <link rel="stylesheet" href="../pages/block.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    .options-card {
      max-width: 680px;
      text-align: left;
    }
    .policy-list {
      margin: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .policy-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
    }
  </style>
</head>
<body>
  <div class="block-card options-card">
    <div class="brand-title">FOCUSGUARD NODE INSPECTOR</div>
    <h1 class="headline" style="font-size: 22px; margin-bottom: 8px;">Active Browser Policies</h1>
    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">
      Showing locally synchronized policies enforced by this browser extension node.
    </p>

    <div class="policy-list" id="policies-container">
      <div class="policy-item">
        <div>
          <div style="font-weight: 700; margin-bottom: 4px;">YouTube Daily Budget</div>
          <div style="font-size: 12px; color: #94a3b8;">Target: youtube.com (Daily Limit: 30m)</div>
        </div>
        <span class="badge-pill">ENFORCING</span>
      </div>
    </div>

    <div class="action-row" style="margin-top: 24px;">
      <button class="btn btn-primary" id="btn-sync-now">Force Policy Sync</button>
      <button class="btn btn-secondary" id="btn-open-web">Open Full Dashboard</button>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
