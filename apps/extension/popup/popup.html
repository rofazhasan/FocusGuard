<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusGuard Status</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="brand">
        <img src="../icons/icon48.png" width="24" height="24" style="border-radius: 6px; box-shadow: 0 0 10px rgba(56,189,248,0.3);" alt="FocusGuard">
        <span class="title">FOCUSGUARD</span>
      </div>
      <div class="status-pill status-active" id="protection-status">
        <span class="dot"></span> Active
      </div>
    </div>

    <!-- Device Identity & Network Status -->
    <div class="card device-card">
      <div class="card-title-row">
        <span class="card-title">Device Link</span>
        <span class="net-badge net-online" id="net-badge">ONLINE</span>
      </div>
      <div class="device-status-row">
        <span class="device-id-text" id="device-id-display">Device: ext_loading...</span>
        <span class="pairing-badge paired" id="pairing-badge">PAIRED</span>
      </div>
      <!-- Unpaired code submission form -->
      <div id="pairing-form" style="display: none; margin-top: 10px;">
        <div style="font-size: 11px; color: var(--muted); margin-bottom: 6px;">Enter 6-character code from dashboard:</div>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="input-pairing-code" placeholder="FG-XXXXXX" maxlength="16" style="flex: 1; padding: 6px 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 6px; color: #fff; font-family: monospace; font-size: 13px; text-transform: uppercase;">
          <button id="btn-submit-pair" style="padding: 6px 12px; background: var(--primary); border: none; border-radius: 6px; color: #fff; font-size: 11px; font-weight: 700; cursor: pointer;">Pair</button>
        </div>
        <div id="pairing-msg" style="font-size: 10px; color: #38bdf8; margin-top: 4px; display: none;"></div>
      </div>
    </div>

    <!-- Active Tab Attention Monitor -->
    <div class="card monitor-card">
      <div class="card-title">Active Site Focus</div>
      <div class="domain-title" id="current-domain">youtube.com</div>
      <div class="usage-meter">
        <div class="usage-text">
          <span id="active-duration">12m 45s</span>
          <span class="budget-limit" id="active-limit">/ 30m daily</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="usage-progress" style="width: 42%;"></div>
        </div>
      </div>
    </div>

    <!-- Focus Session Banner -->
    <div class="card focus-card" id="focus-session-card">
      <div class="focus-header">
        <span class="focus-title">Remote Focus Session</span>
        <span class="focus-badge" id="focus-badge">Standby</span>
      </div>
      <div class="focus-desc" id="focus-desc">No remote session active. All local policies enforcing.</div>
    </div>

    <div class="action-footer">
      <button class="btn-link" id="btn-open-dashboard">Open Fleet Dashboard (Port 3001) →</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
