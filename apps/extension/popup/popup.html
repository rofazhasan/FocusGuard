<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusGuard Status</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="brand">
        <div class="shield-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <span class="title">FOCUSGUARD</span>
      </div>
      <div class="status-pill status-active" id="protection-status">
        <span class="dot"></span> Active
      </div>
    </div>

    <!-- Active Tab Attention Monitor -->
    <div class="card monitor-card">
      <div class="card-title">Active Site Focus</div>
      <div class="domain-title" id="current-domain">youtube.com</div>
      <div class="usage-meter">
        <div class="usage-text">
          <span id="active-duration">12m 45s</span>
          <span class="budget-limit" id="active-limit">/ 30m daily</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="usage-progress" style="width: 42%;"></div>
        </div>
      </div>
    </div>

    <!-- Focus Session Banner -->
    <div class="card focus-card" id="focus-session-card">
      <div class="focus-header">
        <span class="focus-title">Remote Focus Session</span>
        <span class="focus-badge" id="focus-badge">Standby</span>
      </div>
      <div class="focus-desc" id="focus-desc">No remote session active. All local policies enforcing.</div>
    </div>

    <div class="action-footer">
      <button class="btn-link" id="btn-open-dashboard">Open Fleet Dashboard →</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
