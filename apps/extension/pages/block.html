<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusGuard — Site Unavailable</title>
  <link rel="stylesheet" href="block.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="block-card">
    <div class="shield-badge" style="background: transparent; border: none; padding: 0;">
      <img src="../icons/icon128.png" width="68" height="68" style="border-radius: 16px; box-shadow: 0 0 30px rgba(56, 189, 248, 0.45);" alt="FocusGuard Logo">
    </div>

    <div class="brand-title">FOCUSGUARD</div>
    <h1 class="headline">This site is currently unavailable.</h1>

    <div class="reason-container">
      <div class="reason-label">Reason</div>
      <div class="reason-value" id="block-reason">Daily attention budget reached.</div>
    </div>

    <div class="details-box">
      <div class="detail-row">
        <span class="detail-label">Restricted Target:</span>
        <span class="detail-val font-bold" id="blocked-target">youtube.com</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Budget Ratio:</span>
        <span class="detail-val font-mono" id="budget-ratio">30 / 30 minutes</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Policy Scope:</span>
        <span class="detail-val" id="policy-scope">Daily Entertainment Limit</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Next Reset:</span>
        <span class="detail-val font-mono text-purple" id="next-reset">12:00 AM</span>
      </div>
    </div>

    <div class="action-row">
      <button class="btn btn-primary" id="btn-return-focus">Return to Focus</button>
      <button class="btn btn-secondary" id="btn-view-policy">View Policy</button>
    </div>

    <div class="footer-note">
      FocusGuard is actively enforcing attention policies across your registered devices.
    </div>
  </div>

  <script src="block.js"></script>
</body>
</html>
