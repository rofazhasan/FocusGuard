version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: focusguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: focusguard
      POSTGRES_PASSWORD: focusguard_secret
      POSTGRES_DB: focusguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusguard -d focusguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: focusguard-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "focusguard"
      DB_PASSWORD: "focusguard_secret"
      DB_NAME: "focusguard_db"
      JWT_SECRET: "super_secret_focusguard_production_key_2026"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: focusguard-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      NODE_ENV: "production"
    depends_on:
      - backend

volumes:
  postgres_data:
