name: macOS Client CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/macos/**'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/macos/**'
      - '.github/workflows/macos-ci.yml'

jobs:
  build-and-test:
    name: Build & Adversarial Verification (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Swift Toolchain Version
        run: swift --version

      - name: Build FocusGuard macOS Package
        run: |
          cd apps/macos
          swift build -c release

      - name: Run FocusGuard Vertical Slice Verification
        run: |
          cd apps/macos
          swift run FocusGuardVerificationRunner

      - name: Run FocusGuard Adversarial Reliability Suite (21 Scenarios)
        run: |
          cd apps/macos
          swift run FocusGuardAdversarialRunner
