name: FocusGuard Jira Workflow Automation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [ closed ]
    branches: [ main, develop ]

jobs:
  jira_auto_transition:
    name: Auto Detect Jira Issue & Transition to DONE
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Backend Automated Tests
        run: |
          cd backend
          go test ./...

      - name: Login to Jira API
        id: jira_login
        uses: atlassian/gajira-login@v3
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Find Jira Issue Key from Commit Message
        id: find_issue
        uses: atlassian/gajira-find-issue-key@v3
        continue-on-error: true
        with:
          string: ${{ github.event.head_commit.message }}
          fallback: "FG-101"

      - name: Post Verification Comment on Jira Issue
        if: steps.jira_login.outcome == 'success' && steps.find_issue.outputs.issue != ''
        uses: atlassian/gajira-comment@v3
        continue-on-error: true
        with:
          issue: ${{ steps.find_issue.outputs.issue }}
          comment: |
            ✅ Automated CI verification passed on GitHub!
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Status: Automated tests verified. Moving ticket to DONE.

      - name: Auto-Transition Jira Issue to DONE
        if: steps.jira_login.outcome == 'success' && steps.find_issue.outputs.issue != ''
        uses: atlassian/gajira-transition@v3
        continue-on-error: true
        with:
          issue: ${{ steps.find_issue.outputs.issue }}
          transition: "DONE"
