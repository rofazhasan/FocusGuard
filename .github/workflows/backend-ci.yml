name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'infra/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'infra/**'

jobs:
  test:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: focusguard
          POSTGRES_PASSWORD: focusguard_secret
          POSTGRES_DB: focusguard_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Dependencies
        run: |
          cd backend
          go mod download

      - name: Run Static Analysis (go vet)
        run: |
          cd backend
          go vet ./...

      - name: Run Unit & Integration Tests
        run: |
          cd backend
          go test -v -cover ./...
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: focusguard
          DB_PASSWORD: focusguard_secret
          DB_NAME: focusguard_db
